  "machine/templates/RPT-TEMPLATE.md",
  "machine/templates/STD-TEMPLATE.md",
  "machine/templates/SYS-TEMPLATE.md",
  "objects/CHECK.md",
  "objects/catalogue.json",
  "package.json",
]
SPDX-FileCopyrightText = "2026 Numen Games S.L."
SPDX-License-Identifier = "CC0-1.0"

