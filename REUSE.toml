# THE LICENCE IS THE FILE'S, NEVER THE FOLDER'S.
#
# Every file in this repository declares its own licence. A text file does it
# in its own first lines (an SPDX comment: `<!-- … -->` in Markdown, `//` in
# code, `#` in YAML/TOML); a Markdown document with a header also says it in
# `license:`, and machine/guards/rules/std-010-licensing.mjs checks the two agree.
#
# This file lists only the files that CANNOT say it themselves — images,
# fonts, JSON, generated or pinned copies, moulds — one exact path each.
# There are no folder globs here on purpose: a glob gives a licence to a
# file nobody looked at, including the next one someone adds. A new file
# with no declaration fails `reuse lint`, and that is the point.
#
# The regime history (the CC0 root licence until 0157be9, the 2026-08-16
# reservation, each later move) is in git history and in debt/, not here.

# CC0-1.0 — JSON cannot hold a comment; a mould: a comment here would be copied into every document born from it; generated by machine/scripts/entities.mjs; generated by machine/scripts/telemetry.mjs
[[annotations]]
path = [
  "machine/telemetry/claims.json",
  "machine/telemetry/docs.json",
  "machine/telemetry/history.jsonl",
  "machine/telemetry/latest.json",
  "machine/telemetry/latest.md",
  "machine/templates/ADR-TEMPLATE.md",
