# Lexa profile — recommended Hermes configuration additions
# Merge these blocks into Lexa's existing config.yaml.
# Do not overwrite existing model/provider, gateway, integration, or secret configuration.
# Secrets belong in .env, not in config.yaml.

agent:
  tool_use_enforcement: auto

terminal:
  backend: local
  timeout: 120
  home_mode: auto

approvals:
  mode: smart
  denial_breaker_threshold: 2
  deny:
    - "*git push*--force*"
    - "*git push -f*"
    - "*git push*--delete*"
    - "*git push origin :*"
    - "*git push* main"
    - "*git push*:main"
    - "*git push*:refs/heads/main*"
    - "*gh pr merge*"
    - "*rm -rf /"
    - "*rm -rf / *"
    - "*rm -rf ~*"
    - "*rm -rf $home*"
    - "*systemctl*"
    - "*hermes config set*"
    - "*hermes plugins *"
    - "*hermes cron *"
    - "*hermes gateway *"
    - "*hermes auth*"
    - "*.env"
    - "*.env *"
    - "*.env.local*"
    - "*.env.production*"
    - "*auth.json*"
    - "*.pem*"
    - "*/secrets/*"
  smart_policy: |
    HOUSE RULES FOR SPECIALISTS (Oracle, 2026-10-31; they override any line below that says otherwise):
    - Push only to your own branches (the branch of your task); never to main, never a force-push, never delete a remote branch. Pushing your branch and opening a draft pull request from it is allowed without asking.
    - DENY, without asking: deleting anything outside your own working copy or your scratch folder; systemctl and any start, stop or restart of a service; changing configuration (Hermes config.yaml, plugins, scheduled jobs, the gateway, git configuration outside your copy); reading, printing, copying or changing secrets (.env files, auth files, keys, tokens).
    - ALLOW, without asking, the routine work of your trade inside your own working copy: read, build, test, lint, format and commit.
    HOUSE RULES FOR SPECIALISTS (Oracle, 2026-10-31; they override any line below that says otherwise):
    - Push only to your own branches (the branch of your task); never to main, never a force-push, never delete a remote branch. Pushing your branch and opening a draft pull request from it is allowed without asking.
    - DENY, without asking: deleting anything outside your own working copy or your scratch folder; systemctl and any start, stop or restart of a service; changing configuration (Hermes config.yaml, plugins, scheduled jobs, the gateway, git configuration outside your copy); reading, printing, copying or changing secrets (.env files, auth files, keys, tokens).
    - ALLOW, without asking, the routine work of your trade inside your own working copy: read, build, test, lint, format and commit.
    Always ESCALATE any command that publishes, submits, files, signs, accepts,
    transmits, or materially changes legal documents, regulatory filings,
    contractual terms, compliance records, policies, permissions, or
    authoritative project documentation.
    Pushing a branch and opening a pull request is allowed without asking when the repository has no other open pull request (Dependabot does not count); when one is open, prepare locally and wait. Always ESCALATE force-pushes, tags, deleting remote branches and anything under .github/workflows/.
    Escalate destructive Git operations, branch deletion, repository cleanup,
    bulk renames, or commands that may irreversibly alter legal records or
    documentary history.
    Allow ordinary read-only inspection, search, comparison, drafting,
    citation review, local analysis, and non-destructive Git inspection when
    they are otherwise safe.

checkpoints:
  enabled: true
  max_snapshots: 20
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 14
  min_interval_hours: 24

skills:
  write_approval: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: true

delegation:
  max_concurrent_children: 2
  worktree_isolation: true
  max_spawn_depth: 1
  orchestrator_enabled: false
