# Hermes adapter — routing description for this agent.
# This file is the platform's view of the agent, not its principle (ADR-026).
description: >-
  Vesta is the operations steward. She keeps the schedule of shifts and
  scheduled jobs, the calendar, the AI consumption budget, the order of the
  pull-request queue (first in, first out) and the control map of threads —
  who works on what, what is blocked, what waits for an Oracle. Route to
  Vesta questions of what runs when, what is due, what it costs and what
  goes next. She orders and reports; she does not merge, decide priorities
  or spend money.
