# Talos — Hermes profile configuration
# Secrets, API keys, and integration tokens belong in .env.

agent:
  tool_use_enforcement: auto

terminal:
  backend: local
  timeout: 180
  home_mode: auto

approvals:
  mode: smart
  denial_breaker_threshold: 2
  deny:
    - "*git push*--force*"
    - "*git push -f*"
    - "*git push*--delete*"
    - "*git push origin :*"
    - "*git push* main"
    - "*git push*:main"
    - "*git push*:refs/heads/main*"
    - "*gh pr merge*"
    - "*rm -rf /"
    - "*rm -rf / *"
    - "*rm -rf ~*"
    - "*rm -rf $home*"
    - "*systemctl*"
    - "*hermes config set*"
    - "*hermes plugins *"
    - "*hermes cron *"
    - "*hermes gateway *"
    - "*hermes auth*"
    - "*.env"
    - "*.env *"
    - "*.env.local*"
    - "*.env.production*"
    - "*auth.json*"
    - "*.pem*"
    - "*/secrets/*"
    - "git reset --hard*"
    - "git clean -fd*"
  smart_policy: |
    HOUSE RULES FOR SPECIALISTS (Oracle, 2026-10-31; they override any line below that says otherwise):
    - Push only to your own branches (the branch of your task); never to main, never a force-push, never delete a remote branch. Pushing your branch and opening a draft pull request from it is allowed without asking.
    - DENY, without asking: deleting anything outside your own working copy or your scratch folder; systemctl and any start, stop or restart of a service; changing configuration (Hermes config.yaml, plugins, scheduled jobs, the gateway, git configuration outside your copy); reading, printing, copying or changing secrets (.env files, auth files, keys, tokens).
    - ALLOW, without asking, the routine work of your trade inside your own working copy: read, build, test, lint, format and commit.
    HOUSE RULES FOR SPECIALISTS (Oracle, 2026-10-31; they override any line below that says otherwise):
    - Push only to your own branches (the branch of your task); never to main, never a force-push, never delete a remote branch. Pushing your branch and opening a draft pull request from it is allowed without asking.
    - DENY, without asking: deleting anything outside your own working copy or your scratch folder; systemctl and any start, stop or restart of a service; changing configuration (Hermes config.yaml, plugins, scheduled jobs, the gateway, git configuration outside your copy); reading, printing, copying or changing secrets (.env files, auth files, keys, tokens).
    - ALLOW, without asking, the routine work of your trade inside your own working copy: read, build, test, lint, format and commit.
    Allow read-only repository inspection, git log/show/diff/status, workflow
    and configuration review, static analysis, dependency review, and safe
    local execution of existing validation/test commands.
    Allow preparation of local proposed patches when non-destructive.
    ESCALATE changes to live GitHub settings, rulesets, permissions, branch
    protections, environments, secrets, CI/CD workflows, security controls,
    guard scripts, deployment automation, CODEOWNERS, or required checks.
    ESCALATE any attempt to disable or bypass a safeguard, publish a sensitive
    vulnerability, run intrusive external security testing, or perform
    destructive Git/filesystem operations.
    Never print secret values.

checkpoints:
  enabled: true
  max_snapshots: 25
  max_total_size_mb: 500
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 14
  min_interval_hours: 12

skills:
  write_approval: true

memory:
  memory_enabled: true
  user_profile_enabled: false
  memory_char_limit: 2400
  user_char_limit: 600
  write_approval: true

delegation:
  max_concurrent_children: 2
  worktree_isolation: true
  max_spawn_depth: 1
  orchestrator_enabled: false
