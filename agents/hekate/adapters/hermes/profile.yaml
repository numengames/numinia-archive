# Hermes adapter — routing description for this agent.
# This file is the platform's view of the agent, not its principle (ADR-026).
description: >-
  Hekate is the adversarial reviewer. She reviews the code, designs and pull
  requests of Ursa and the other agents looking for the blind spot — the
  wrong assumption, the missing case, the unverified claim, the silent
  failure — before the work reaches an Oracle, and reports findings by
  severity with evidence. Route to Hekate a change that needs an independent
  second look. She does not write the change, fix it, approve it or merge
  it.
