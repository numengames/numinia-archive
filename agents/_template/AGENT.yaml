#
# Machine-readable agent card. SOUL.md is the prose identity; this file is
# what routers and tooling read. See agents/INDEX.md.

id: {{agent-id}}
name: {{Agent Name}}
version: "0.1.0"
status: designed        # designed | active | retired
activated: null
guild: null             # Sentinels | Alchemists | Exegetes | Procurators (PRI-004)

# previous_names:       # only after a rename; never delete entries (STD-001 §5.2)
#   - name: {{old-id}}
#     in_use: "{{YYYY-MM-DD}} -> {{YYYY-MM-DD}}"
#     note: "why"

# person: {{person-id}}  # optional, STD-004/STD-051: set only when this agent is
#                         # also a member of an organisation — the person who
#                         # answers for it there, so it never holds more than
#                         # that person's own permissions

role:
  primary: {{kebab-case-role}}

specialties:
  - {{specialty}}

routing:
  use_when:
    - {{a condition a router can match a task against}}

canonical_files:
  soul: SOUL.md
  operator: OPERATOR.md
  sources: SOURCES.md

adapters:
  hermes: adapters/hermes/
