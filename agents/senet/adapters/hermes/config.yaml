# Senet profile — recommended Hermes configuration additions
# Merge these blocks into Senet's existing config.yaml.
# Do not overwrite existing model/provider, gateway, integration, or secret configuration.
# Secrets belong in .env, not in config.yaml.

agent:
  tool_use_enforcement: auto

terminal:
  backend: local
  timeout: 120
  home_mode: auto

approvals:
  mode: smart
  denial_breaker_threshold: 3
  deny:
    - "git push --force*"
    - "git push -f*"
    - "rm -rf *"
  smart_policy: |
    Always ESCALATE destructive, irreversible, or high-impact operations.
    Always ESCALATE commands that publish, push, overwrite, delete, or materially
    alter authoritative game rules, canonical project content, campaign records,
    or repository history.
    Allow ordinary read-only inspection, source lookup, local drafting, rule
    comparison, non-destructive formatting, and routine analysis when they are
    otherwise safe.

checkpoints:
  enabled: true
  max_snapshots: 15
  max_total_size_mb: 350
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24

skills:
  write_approval: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 2200
  user_char_limit: 1375
  write_approval: true

delegation:
  max_concurrent_children: 2
  worktree_isolation: true
  max_spawn_depth: 1
  orchestrator_enabled: false
