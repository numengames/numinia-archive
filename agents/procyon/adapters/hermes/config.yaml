# Procyon — Hermes profile configuration
# Secrets, API keys, and integration tokens belong in .env.

agent:
  tool_use_enforcement: auto

terminal:
  backend: local
  timeout: 120
  home_mode: auto

approvals:
  mode: smart
  denial_breaker_threshold: 3
  deny:
    - "git push --force*"
    - "git push -f*"
    - "rm -rf *"
  smart_policy: |
    Allow ordinary read-only inspection, source lookup, public-facing drafting,
    summarization, orientation, and non-destructive formatting when safe.
    ESCALATE destructive or irreversible operations, publication or external
    commitments, changes to authoritative institutional or project content,
    and actions that could represent the organization externally without
    explicit authorization.

checkpoints:
  enabled: true
  max_snapshots: 15
  max_total_size_mb: 300
  max_file_size_mb: 10
  auto_prune: true
  retention_days: 7
  min_interval_hours: 24

skills:
  write_approval: true

memory:
  memory_enabled: true
  user_profile_enabled: true
  memory_char_limit: 1800
  user_char_limit: 1200
  write_approval: true

delegation:
  max_concurrent_children: 2
  worktree_isolation: true
  max_spawn_depth: 1
  orchestrator_enabled: false
