#
# Dependency audit (STD-015 SEC-018): the site's production dependencies
# (web/, the only lockfile in the repository) against the advisory database,
# high and above. Seen, not enforced. The job lives once, in
# numengames/.github.
name: audit

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "15 6 * * 1"

permissions:
  contents: read

jobs:
  audit:
    uses: numengames/.github/.github/workflows/audit.yml@c87e85e17306324752a59426f899e48059d42609
    permissions:
      contents: read
    with:
      package-manager: npm
      working-directory: web
