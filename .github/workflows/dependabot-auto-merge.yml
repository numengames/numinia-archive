#
# Dependabot pull requests merge themselves once every required check is
# green (Oracle rule, 2026-09-18). The job lives once, in numengames/.github;
# only it gets write, and only the two scopes it needs. Requires "Allow
# auto-merge" in the repository settings (operator act).
name: Dependabot auto-merge

on: pull_request

permissions: read-all

jobs:
  auto-merge:
    uses: numengames/.github/.github/workflows/dependabot-auto-merge.yml@c87e85e17306324752a59426f899e48059d42609
    permissions:
      contents: write
      pull-requests: write
