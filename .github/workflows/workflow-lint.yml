#
# Workflow lint (STD-015 SEC-017): actionlint and zizmor over this
# repository's workflows. Seen, not enforced. The job lives once, in
# numengames/.github.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    uses: numengames/.github/.github/workflows/workflow-lint.yml@3d2cca44cebc8ef7420f1bee3451d7227d55d8ce
    permissions:
      contents: read
