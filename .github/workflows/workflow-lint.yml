#
# Workflow lint (STD-015, SEC-007/SEC-008): actionlint reads every workflow
# for syntax, expression and shell errors; zizmor reads them for security
# smells (unpinned actions, excessive permissions, template injection,
# credentials left in the checkout). Seen, not enforced: both verdicts go to
# the job summary and the job stays green while the pre-existing findings are
# triaged. It is not a required check.
#
# Both tools are pinned: actionlint is the release binary verified against
# the checksum file its release publishes; zizmor is a pinned PyPI version.
# No third-party action is involved and the token is read-only.
name: workflow-lint

on:
  pull_request:
    paths:
      - ".github/workflows/**"
  push:
    branches: [main]
    paths:
      - ".github/workflows/**"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  lint:
    runs-on: ubuntu-latest
    env:
      ACTIONLINT_VERSION: 1.7.12
      ZIZMOR_VERSION: 1.30.1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: install actionlint (checksum verified)
        run: |
          base="https://github.com/rhysd/actionlint/releases/download/v${ACTIONLINT_VERSION}"
          tarball="actionlint_${ACTIONLINT_VERSION}_linux_amd64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/actionlint_${ACTIONLINT_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" actionlint
          ./actionlint -version

      - name: actionlint (seen, not enforced)
        continue-on-error: true
        run: |
          set +e
          out="$(./actionlint -color=false 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "actionlint: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### actionlint — findings, not blocking (seen, not enforced)"
            echo
            echo '```'
            echo "$out" | head -60
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::actionlint found problems — see the job summary; not blocking"
          exit "$status"

      - name: zizmor (seen, not enforced)
        continue-on-error: true
        run: |
          pipx install "zizmor==${ZIZMOR_VERSION}"
          set +e
          out="$(zizmor --format plain .github/workflows 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "zizmor: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### zizmor — findings, not blocking (seen, not enforced)"
            echo
            echo '```'
            echo "$out" | head -80
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::zizmor found problems — see the job summary; not blocking"
          exit "$status"
