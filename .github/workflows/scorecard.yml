#
# OpenSSF Scorecard — engineering-standards.md §3.1: measurement before
# enforcement. Weekly + on push to main; results published to the
# OpenSSF API (badge). SARIF upload to code scanning deliberately
# omitted for now (GitHub API instability at adoption time); the raw
# results are kept as a build artifact.
name: scorecard

on:
  schedule:
    - cron: "30 5 * * 1"
  push:
    branches: [main]

permissions: read-all

jobs:
  analysis:
    runs-on: ubuntu-latest
    permissions:
      id-token: write # required by publish_results
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.json
          results_format: json
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.json
          retention-days: 30
