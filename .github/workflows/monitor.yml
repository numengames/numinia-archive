#
# Night watch for numinia.org (STD-015 SRE-008): a probe of the live site
# every six hours. On failure it opens a `night-watch` issue here; on
# recovery it closes it. The job lives once, in numengames/.github; this
# file says when and what to probe.
#
# A failure seen only from Spain may be a Cloudflare range blocked during
# football matches (status 000): check from another network before acting.
name: monitor

on:
  schedule:
    - cron: "23 */6 * * *" # every six hours, off the :00 stampede
  workflow_dispatch:

permissions: {}

concurrency:
  group: night-watch
  cancel-in-progress: false

jobs:
  probe:
    uses: numengames/.github/.github/workflows/monitor.yml@c87e85e17306324752a59426f899e48059d42609
    permissions:
      issues: write
    with:
      site: numinia.org
      follow-redirects: false
      checks: |
        / 200
        /home.md 200
        /map/ 200
        /lexicon/ 200
