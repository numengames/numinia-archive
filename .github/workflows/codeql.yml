#
# Code scanning: CodeQL reads the site, the Worker and the
# machine scripts as JavaScript/TypeScript source, with no build. Findings go
# to the repository's Security tab, not to this run's colour: the workflow is
# seen, not enforced — it is not a required check, and a finding fails no
# merge until someone triages it.
#
# Actions are pinned by commit SHA. The token is read-only except for the one
# permission the upload needs.
name: codeql

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: "45 5 * * 1"

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    permissions:
      security-events: write # upload the results to code scanning
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - uses: github/codeql-action/init@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          languages: javascript-typescript
          build-mode: none

      - uses: github/codeql-action/analyze@2892aa5e19bbd11bc0cff5427e3b750a04d9e3c2 # v4.38.2
        with:
          category: /language:javascript-typescript
