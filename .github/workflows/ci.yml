# SPDX-License-Identifier: MIT
#
# This workflow is the corpus's feedback loop: it is where a rule stops being
# prose and starts refusing merges. Each step below names what it checks and
# how to fix it when it turns red.
#
# Order is not cosmetic. Everything before `install` is bare node over the
# working tree: no npm, no web/. The build guards read web/dist, so they can
# only run after `build` — the runner exits 2 if that directory is missing, so
# a misplaced step fails loudly instead of passing blind.
#
# The workflow names no guard. What runs is what machine/scripts/run-guards.mjs finds
# in the registry (ENG-032); a guard enters CI by being merged.
#
# Actions are pinned by commit SHA, not by tag: a tag can be moved by its
# owner, a SHA cannot. The token is read-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout of the PR head, pinned by SHA.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history, not a shallow clone: the telemetry guard reads git
          # history (first-add dates, renames). A depth-1 checkout measures a
          # different repository and the comparison below fails as ALTERED.
          fetch-depth: 0

      # Node 22, npm cache keyed on the site's lockfile.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Downloads the tokenizer rank file (~1.6 MB, gitignored) and verifies
      # its checksum. Without it the token figures are null and the next step
      # fails. Needs network egress to the tokenizer host.
      - name: telemetry — tokenizer rank file
        run: node machine/scripts/telemetry.mjs --fetch-tokenizer

      # Every rule guard named by machine/scripts/blind-spots.json (ENG-032), wherever
      # its script sits. Each reports every finding it sees; whether one fails
      # the build is decided by the state of the standard that holds the rule
      # (ENG-067). Red means: a rule whose standard is active is broken — the
      # line names the file. This step is itself a claim 23 rows of STD-015
      # rest on, so check-register verifies the step is still here.
      - name: rule guards
        run: npm run guards -- --rules

      # The guards' own tests, and the telemetry instrument's self-tests on
      # throwaway clones. Red means: a guard or the instrument is broken, not
      # the tree.
      #
      # Coverage over machine/scripts/, machine/guards/ and machine/tools/ is measured on every run
      # (node --experimental-test-coverage) and two numbers go to the job
      # summary: node's figure, and how many source files no test loads —
      # node only reports files that ran, so the figure alone overstates
      # (12 of 37 on 2026-09-19). No threshold: while STD-015 is draft the
      # figure is seen, not enforced (ENG-067). A failing test still fails
      # this step.
      - name: tests
        run: npm test 2>&1 | tee /tmp/test-output.txt

      # Reads the output the step above saved. Runs even when a test failed
      # (`if: always()`), so a red run still shows its coverage.
      - name: tests — coverage to the job summary
        if: always()
        run: |
          out="$(cat /tmp/test-output.txt 2>/dev/null)"
          # Three groups. Loaded: node measured it. Tested as a process: a
          # test spawns the script (machine/scripts/test/<name>.test.mjs or
          # machine/tools/test/<name>.test.mjs exists) — node cannot see inside a
          # child, so the figure omits it although it is tested. Untested:
          # neither. Only the last group is a gap.
          find machine/scripts machine/guards machine/tools -name '*.mjs' -not -path '*/test/*' -printf '%f\n' | sort -u > /tmp/all.txt
          echo "$out" | grep -oE '[A-Za-z0-9_-]+\.mjs +\|' | grep -oE '[A-Za-z0-9_-]+\.mjs' | sort -u > /tmp/loaded.txt
          find machine/scripts/test machine/guards/test machine/tools/test -name '*.test.mjs' -printf '%f\n' | sed 's/\.test\.mjs$/.mjs/' | sort -u > /tmp/tested.txt
          total=$(wc -l < /tmp/all.txt)
          loaded=$(comm -12 /tmp/all.txt /tmp/loaded.txt | wc -l)
          process=$(comm -23 /tmp/all.txt /tmp/loaded.txt | comm -12 - /tmp/tested.txt | wc -l)
          untested=$(comm -23 /tmp/all.txt /tmp/loaded.txt | comm -23 - /tmp/tested.txt | tr '\n' ' ')
          {
            echo "### Coverage of machine/scripts/, machine/guards/, machine/tools/ — seen, not enforced (STD-015 draft, ENG-067)"
            echo
            echo '```'
            echo "$out" | grep -E '^ℹ all files' | sed 's/^ℹ //' || echo "(no coverage line in the output)"
            echo "source files: $total · loaded by a test: $loaded · tested as a process (outside the figure): $process · no test: $((total - loaded - process))"
            [ -n "$untested" ] && echo "no test: $untested"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      # A change to the site must say what it changed: any diff under
      # web/src/ needs a new entry (and version) in web/src/data/updates.ts.
      # The footer prints that version and links to /updates.
      - name: version bump
        run: node machine/scripts/check-version-bump.mjs --base origin/${{ github.base_ref || 'main' }}

      # Dependencies of the Astro site, from the lockfile. Not a check.
      - name: install
        run: npm ci
        working-directory: web

      # `astro check`: the type checker over web/src. A component handed a
      # prop it does not declare, a dictionary key that does not exist, a
      # function returning something its caller does not expect — all of
      # that fails here, not in the visitor's browser. `astro build` does
      # NOT do this: it renders the page and prints `undefined` where the
      # text was (numen.games, 2026-09-11: six dead dictionary keys, green
      # build). REPORTS for now: the tree carries 12 pre-existing errors
      # (a stray comment inside a JSX expression, two shadcn stubs importing
      # a `@/lib/utils` that was never created, an untyped map), so
      # findings go to the job summary as warnings and the step exits 0.
      # It starts biting once those are fixed — delete the block after the
      # `status` line and let `npm run type-check` decide. The archive's rule
      # guards (std-004, std-020, …) are untouched by this step.
      - name: type-check (reports until the 12 pre-existing errors are fixed)
        working-directory: web
        run: |
          set +e
          out="$(npm run type-check 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "astro check: clean." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### astro check — errors, not blocking until the pre-existing ones are fixed (STD-015 draft, ENG-067)"
            echo
            echo '```'
            echo "$out" | grep -E ' - error ' | head -30
            echo "$out" | grep -E '^- [0-9]+ (errors|warnings|hints)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::astro check found errors — see the job summary; not blocking yet"
          exit 0

      # ARC-003 (STD-015): REUSE 3.3 — every file names its licence, in a
      # header or through REUSE.toml, and LICENSES/ holds the text of every
      # licence the map names. The footer of the four sites says "Open by
      # licence, per file" and links REUSE.toml: this step is what makes
      # that sentence true. The archive's own std-010-licensing guard
      # compares each document's `license:` header with the map; it does
      # not look at files that are not documents (the web, scripts,
      # images) nor at LICENSES/ — this does. Pinned version, the one the
      # other repositories run. Reports while STD-015 is draft (ENG-067):
      # the verdict goes to the job summary and the step exits 0.
      - name: REUSE lint (every file declares its licence)
        run: |
          pipx install reuse==6.2.0
          set +e
          out="$(reuse lint 2>&1)"; status=$?
          set -e
          echo "$out"
          if [ "$status" -eq 0 ]; then
            echo "REUSE lint: compliant." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          {
            echo "### REUSE lint — not compliant, not blocking while STD-015 is draft (ENG-067)"
            echo
            echo '```'
            reuse lint --lines 2>/dev/null | head -40
            echo "$out" | grep -E '^\* (Missing|Unused|Files with)'
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          echo "::warning::reuse lint is not compliant — see the job summary"
          exit 0

      # Builds web/dist. A page that fails to render fails here. Not a check,
      # but the build guards below read its output.
      - name: build
        run: npm run build
        working-directory: web

      # DSN-014 (STD-008): a link presents itself. The build above drew the
      # favicon set and the 1200×630 share card into web/public; this proves
      # the four files exist and the card has the size link previews need.
      - name: share card
        run: node scripts/share-card.mjs --check
        working-directory: web

      # Every build guard: the built site and the committed telemetry are what
      # HEAD produces. These bite regardless of any standard's state. Red
      # means: a page, a link, a redirect or the dataset is broken. Fix a
      # telemetry red by running `node machine/scripts/telemetry.mjs` on the branch
      # and committing machine/telemetry/ — never by hand-editing latest.json.
      - name: build guards
        run: npm run guards -- --build
