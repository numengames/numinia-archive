#
# This workflow is the corpus's feedback loop: it is where a rule stops being
# prose and starts refusing merges. Each step below names what it checks and
# how to fix it when it turns red.
#
# Order is not cosmetic. Everything before `install` is bare node over the
# working tree: no npm, no web/. The build guards read web/dist, so they can
# only run after `build` — the runner exits 2 if that directory is missing, so
# a misplaced step fails loudly instead of passing blind.
#
# The workflow names no guard. What runs is what scripts/run-guards.mjs finds
# in the registry (ENG-032); a guard enters CI by being merged.
#
# Actions are pinned by commit SHA, not by tag: a tag can be moved by its
# owner, a SHA cannot. The token is read-only.
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions: read-all

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      # Checkout of the PR head, pinned by SHA.
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # Full history, not a shallow clone: the telemetry guard reads git
          # history (first-add dates, renames). A depth-1 checkout measures a
          # different repository and the comparison below fails as ALTERED.
          fetch-depth: 0

      # Node 22, npm cache keyed on the site's lockfile.
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json

      # Downloads the tokenizer rank file (~1.6 MB, gitignored) and verifies
      # its checksum. Without it the token figures are null and the next step
      # fails. Needs network egress to the tokenizer host.
      - name: telemetry — tokenizer rank file
        run: node scripts/telemetry.mjs --fetch-tokenizer

      # Every rule guard named by scripts/blind-spots.json (ENG-032), wherever
      # its script sits. Each reports every finding it sees; whether one fails
      # the build is decided by the state of the standard that holds the rule
      # (ENG-067). Red means: a rule whose standard is active is broken — the
      # line names the file. This step is itself a claim 23 rows of STD-015
      # rest on, so check-register verifies the step is still here.
      - name: rule guards
        run: npm run guards -- --rules

      # The guards' own tests, and the telemetry instrument's self-tests on
      # throwaway clones. Red means: a guard or the instrument is broken, not
      # the tree.
      - name: tests
        run: npm test

      # A change to the site must say what it changed: any diff under
      # web/src/ needs a new entry (and version) in web/src/data/updates.ts.
      # The footer prints that version and links to /updates.
      - name: version bump
        run: node scripts/check-version-bump.mjs --base origin/${{ github.base_ref || 'main' }}

      # Dependencies of the Astro site, from the lockfile. Not a check.
      - name: install
        run: npm ci
        working-directory: web

      # Builds web/dist. A page that fails to render fails here. Not a check,
      # but the build guards below read its output.
      - name: build
        run: npm run build
        working-directory: web

      # Every build guard: the built site and the committed telemetry are what
      # HEAD produces. These bite regardless of any standard's state. Red
      # means: a page, a link, a redirect or the dataset is broken. Fix a
      # telemetry red by running `node scripts/telemetry.mjs` on the branch
      # and committing telemetry/ — never by hand-editing latest.json.
      - name: build guards
        run: npm run guards -- --build
