#
# The full-history secret scan (STD-015 SEC-004, STD-022 KEY-054): no
# secret in the tree or in any commit of its history. Red means a commit
# carries something that looks like a key; the log names the rule, the file
# and the commit, with the value redacted.
#
# If it is a real secret: change the key at its issuer first, then remove
# it (step 2 of PRO-036) — deleting it from the tree does not take it out of history.
# If it is not a secret: add an allowance to .gitleaks.toml that matches
# only the value, with a reason; never allow a whole path.
#
# The scanner is the gitleaks release binary, verified against the checksum
# file its release publishes, so no third-party action and no licence key
# is involved. The token is read-only.
name: secrets

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "0 6 * * 1"

permissions: read-all

jobs:
  scan:
    runs-on: ubuntu-latest
    env:
      GITLEAKS_VERSION: 8.30.1
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          # The whole history: a secret removed from the tree is still in
          # the commit that added it.
          fetch-depth: 0

      - name: install gitleaks (checksum verified)
        run: |
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          tarball="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL -o "$tarball" "$base/$tarball"
          curl -sSfL -o checksums.txt "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt"
          grep " $tarball\$" checksums.txt | sha256sum -c -
          tar xzf "$tarball" gitleaks
          ./gitleaks version

      - name: scan every commit
        run: ./gitleaks git --config .gitleaks.toml --redact --no-banner --exit-code 1 .
