# Dependabot: keep every dependency at its latest version.
# Oracle rule (2026-09-18): nothing stays pinned to an old release; the
# checks decide, not a person. `dependabot-auto-merge.yml` approves and
# merges each update once CI is green.
# Cooldown (2026-10-15): a version is proposed only after it has been public
# for 7 days, so a hijacked or broken release is usually flagged by others
# before it reaches this repository. Security updates ignore the cooldown.
# Grouping (2026-10-20): each ecosystem sends ONE pull request with all its updates
# (group `all-dependencies`), so there is never a pile of separate ones. Dependabot cannot
# group across ecosystems, so npm / github-actions / pip each still open their own.
version: 2
updates:
  - package-ecosystem: npm
    directory: "/web"
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    commit-message:
      prefix: "chore(deps)"
    cooldown:
      default-days: 7
    ignore:
      # @astrojs/check does not support TypeScript 7 yet: the major left the
      # dev-tooling group red (PR #492). Remove this when it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
    groups:
      all-dependencies:
        patterns: ["*"]
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: daily
    commit-message:
      prefix: "ci(deps)"
    cooldown:
      default-days: 7
    groups:
      all-dependencies:
        patterns: ["*"]
