#
# The repositories of the numengames organisation, as data (SYS-013).
#
# ONE ENTRY PER REPOSITORY. This file is the source: the two tables in
# SYS-013 are generated from it by machine/tools/repos-table.mjs, and a test
# (machine/checks/test/sys-013-repositories-as-data.test.mjs) fails when they
# differ. Edit here, run `node machine/tools/repos-table.mjs`, commit both.
#
# A new repository gets its entry HERE FIRST, with state `to-create` and
# `id: null`; the GitHub id is filled in when it exists (SYS-013, «Joining and
# leaving»).
#
# Fields
#   id            GitHub's numeric id; it survives a rename. null only while to-create.
#   name          the name today.
#   former_names  names it had (a rename keeps the id; the old name resolves to this entry).
#   state         active | deprecated | to-archive | archived | to-create
#   project       the project it belongs to (null when it belongs to none).
#   board         the Kanban board its cards go to (null when it has none).
#   owner         the human who answers for it.
#   description   GitHub's description, as GitHub shows it (null when GitHub has none).
#   homepage      GitHub's homepage field, as GitHub shows it (null when empty).
#   publishes     what it puts in front of people: a site, an image.
#   is            what it is.
#   is_not        what it is NOT: the neighbour a reader might take it for.
#   licence       its licence regime.
#   reads         what it reads from another repository, each "<repository>: <what>".
#                 Who READS a repository is not written: the table works it out.
#
# Format: a restricted subset of YAML that machine/tools/repos-table.mjs reads
# without a library (guards run before any dependency is installed): one list
# `repositories:` of flat mappings; a value is a double-quoted string, a bare
# word or number, `null`, `[]` or a block list of double-quoted strings.

repositories:

