    is_not: "Not the code of numinia.com (numinia-platform), not the heavy files (numinia-assets), not what automation finds before anyone has read it (numinia-archive-feed)."
    licence: "Per file, declared in `REUSE.toml`: documents CC0-1.0 or CC-BY-4.0, tools MIT, fonts OFL-1.1, legal texts and the brand reserved."
