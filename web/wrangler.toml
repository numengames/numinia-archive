# Declarative deploy config for the Numinia viewer on Cloudflare Workers.
# Replaces manual dashboard setup — no dashboard-only configuration.
#
# Deploy is AUTOMATIC: Workers Builds listens to `main`, runs
# `npm ci && npm run build`, then `npx wrangler deploy`. A merge reaches
# production without anyone touching a panel, and the page footer prints the
# commit it was built from, so the deployed SHA is checkable from outside.
#
# Correction record — 2026-08-25 (STD-001 §2.1.2). This comment previously read
# "Deploy from web/: npx wrangler deploy", describing a manual deploy. It was
# true for eight days: the Workers Builds Git connection had silently dropped
# ("This project is disconnected from your Git account"), production served a
# build from 2026-08-17, and a local authenticated `wrangler deploy` was the
# only path. Reconnected 2026-08-25 and verified: numinia.org serves c2ee691,
# the HEAD of main. The manual command still works and remains the fallback if
# the connection drops again — which it did once, silently, and nothing warned.
#
# The worker was named after its repository when both were numinia-nwos;
# the repository is numengames/numinia-archive since 2026-09-17.
# NOTE: deliberately not reusing the existing `numinia-web` worker
# (nwos-web.pablofm.workers.dev), which may still be the only host
# of the NWOS product (/velo, /api/registro).
# Historical name of the DEPLOYED service. Changing it does not rename the
# worker: wrangler creates a new, empty one and numinia.org goes dark. Do not
# touch without a migration in the Cloudflare panel first.
name = "numinia-nwos"
compatibility_date = "2026-08-16"

# Serve the site at the apex and www; Cloudflare manages both DNS records.
# Canonicals point at the apex (Layout.astro siteUrl), so www duplicating
# content is harmless for SEO.
routes = [
  { pattern = "numinia.org", custom_domain = true },
  { pattern = "www.numinia.org", custom_domain = true }
]

# Fully static site: no `main` worker script, just static assets.
# Directory matches Astro's build output (`npm run build` → dist/).
# not_found_handling (MIS-128): serve the site's own 404.astro build
# instead of Cloudflare's bare error — DEUDA-404 documents accepted URL
# breakage, so the 404 a reader actually meets has to offer navigation.
[assets]
directory = "./dist"
not_found_handling = "404-page"
